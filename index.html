<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myndigo</title>
    <meta name="description" content="Keep your child's world safe and understood. Myndigo helps ASD families share critical information instantly via QR code or NFC." />
    <!--
      Restores the real path after GitHub Pages' 404.html redirect trick
      (see public/404.html). Runs before React Router mounts so deep links
      and page refreshes on client-side routes work on GitHub Pages, which
      has no server-side rewrite rules. No-op on any host that never hits
      404.html (Vercel, local dev, etc.) since l.search won't start with "/?/".
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
