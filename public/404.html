<!doctype html>
<!--
  GitHub Pages has no server-side rewrite rules, so a direct visit or a
  page refresh on a client-side route (e.g. /myndigo/s/abc123) returns this
  404.html instead of index.html. This redirects back to the app's root
  with the originally requested path encoded in a query param, and a tiny
  script in index.html (see main.tsx) restores it via history.replaceState
  before React Router mounts — so deep links and refreshes work normally.

  This is the standard SPA-on-GitHub-Pages workaround (the same approach
  used by spa-github-pages: https://github.com/rafgraph/spa-github-pages).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Myndigo</title>
    <script>
      // Repo name segment count in the base path, e.g. "/myndigo/" -> 1.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
